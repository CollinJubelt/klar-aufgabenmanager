function renderDashboard(){const s=getStats(),arr=live().filter(active).sort((a,b)=>score(b)-score(a)), due=arr.filter(t=>dateDelta(t.due)!==null&&dateDelta(t.due)<=0), focus=due.length?due.slice(0,6):arr.slice(0,6), largest=Math.max(1,...AREAS.map(a=>arr.filter(t=>t.area===a).length));

 <div class="dashboard-grid"><section class="panel"><div class="panel-head"><span class="panel-title">${due.length?'Dringende Aufgaben':'Deine wichtigsten Aufgaben'}</span><button class="text-link" data-page="tasks">Alle anzeigen ${ic('arrow','sm')}</button></div><div class="focus-list">${focus.length?focus.map(focusRow).join(''):`<div class="empty">${ic('check')}<strong>Alles erledigt.</strong><span>Du hast derzeit keine offenen Aufgaben.</span></div>`}</div></section><section class="panel"><div class="panel-head"><span class="panel-title">Deine Bereiche</span><span class="small-note">Offene Aufgaben</span></div>${AREAS.filter(a=>a!=='Noch zuordnen'||arr.some(t=>t.area===a)).map(a=>{const n=arr.filter(t=>t.area===a).length;return `<div class="bar-row"><span class="bar-name">${esc(a)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/largest*100)}%"></div></div><span class="bar-num">${n}</span></div>`}).join('')}<div class="overview-foot"><strong style="color:#626a72">${s.done} erledigt · ${s.waiting} warten</strong><div>${s.all?Math.round(s.done/s.all*100):0} % deiner erfassten Aufgaben sind abgeschlossen.</div></div></section></div>

function renderCalendar(){const [year,month]=state.calendarMonth.split('-').map(Number);const first=new Date(Date.UTC(year,month-1,1)),daysInMonth=new Date(Date.UTC(year,month,0)).getUTCDate(),offset=(first.getUTCDay()+6)%7;const dateId=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const monthName=new Intl.DateTimeFormat('de-DE',{timeZone:'UTC',month:'long',year:'numeric'}).format(first);let cells='';for(let i=0;i<42;i++){const d=i-offset+1,full=new Date(Date.UTC(year,month-1,d)),id=dateId(full.getUTCFullYear(),full.getUTCMonth()+1,full.getUTCDate()),ts=live().filter(t=>active(t)&&t.due===id),other=d<1||d>daysInMonth;cells+=`<button class="cal-day ${other?'other-month':''} ${id===today()?'current':''} ${id===state.selectedDay?'selected':''}" data-action="selectday" data-day="${id}"><span class="cal-date">${full.getUTCDate()}</span><span class="cal-dot-row">${ts.slice(0,8).map(t=>`<span class="cal-dot ${dateDelta(t.due)<0?'late':''}"></span>`).join('')}</span>${ts.slice(0,2).map(t=>`<span class="cal-entry">${esc(t.title)}</span>`).join('')}</button>`}

function closeModal(){modalRoot.innerHTML='';state.modal='';}
function openEdit(id=''){const old=id?tasks.find(t=>t.id===id):null;const t=old||{title:'',area:state.page.startsWith('area:')?state.page.slice(5):state.lastArea,subcategory:'',context:'',status:'Eingang',priority:'B - Mittel',due:'',minutes:'',nextStep:'',waitingFor:'',notes:'',doneAt:''};state.modal='edit';const options=(arr,current)=>arr.map(a=>`<option value="${esc(a)}" ${a===current?'selected':''}>${esc(a)}</option>`).join('');
 modalRoot.innerHTML=`<div class="modal-backdrop" data-overlay="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${old?'Aufgabe bearbeiten':'Neue Aufgabe'}</h2><button class="btn icon-btn" data-action="close" aria-label="Schließen">${ic('x')}</button></div><form class="modal-form" id="taskForm"><div class="field-grid"><div class="field span2"><label for="fTitle">Aufgabe *</label><input id="fTitle" name="title" value="${esc(t.title)}" placeholder="Was muss erledigt werden?" required maxlength="500" autofocus></div><div class="field"><label>Bereich</label><select name="area" id="fArea">${options(AREAS,t.area)}</select></div><div class="field"><label>Unterbereich</label><input name="subcategory" id="fSub" list="subData" value="${esc(t.subcategory)}" placeholder="z. B. BCS Next Gen"><datalist id="subData">${(SUBS[t.area]||[]).map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div><div class="field span2"><label>Projekt / Kontext</label><input name="context" value="${esc(t.context)}" placeholder="Projekt oder Hintergrund"></div><div class="field"><label>Status</label><select name="status">${options(STATUSES,t.status)}</select></div><div class="field"><label>Priorität</label><select name="priority">${options(PRIORITIES,t.priority)}</select></div><div class="field"><label>Fällig am</label><input type="date" name="due" value="${esc(t.due)}"></div><div class="field"><label>Zeitaufwand (Minuten)</label><input type="number" name="minutes" min="0" max="100000" value="${t.minutes??''}" placeholder="Optional"></div><div class="field span2"><label>Nächster Schritt</label><input name="nextStep" value="${esc(t.nextStep)}" placeholder="Was ist konkret als Nächstes zu tun?"></div><div class="field"><label>Warten auf / Person</label><input name="waitingFor" value="${esc(t.waitingFor)}" placeholder="Name oder Abhängigkeit"></div><div class="field"><label>Erledigt am</label><input type="date" name="doneAt" value="${esc(t.doneAt)}"></div><div class="field span2"><label>Notizen</label><textarea name="notes" placeholder="Details, Links, Ideen …">${esc(t.notes)}</textarea></div></div><div class="form-actions">${old?`<button type="button" class="btn warn small" data-action="delete" data-id="${esc(old.id)}">${ic('trash','sm')} Löschen</button>`:''}<div class="action-right"><button type="button" class="btn" data-action="close">Abbrechen</button><button type="submit" class="btn primary">${ic('check','sm')} Speichern</button></div></div></form></div></div>`;modalRoot.dataset.editId=id;document.getElementById('fTitle').focus();}
function settingField(label,id,value,placeholder='',type='text'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value||'')}" placeholder="${esc(placeholder)}" autocomplete="off"></div>`}
function openSettings(){state.modal='settings';modalRoot.innerHTML=`<div class="modal-backdrop" data-overlay="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="modal-head"><h2 id="settingsTitle">Einstellungen</h2><button class="btn icon-btn" data-action="close" aria-label="Schließen">${ic('x')}</button></div><div class="modal-form"><div class="banner">Deine Aufgaben werden auf diesem Gerät gespeichert. Für die Synchronisierung zwischen Handy und Computer kannst du eine private Supabase-Cloud verbinden. Automatische tägliche Telegram-Benachrichtigungen benötigen zusätzlich die Einrichtung des Benachrichtigungsdienstes.</div><div class="settings-section" style="margin-top:0;border:0;padding:0"><h3>${ic('cloud','sm')} Cloud-Synchronisierung</h3><p>Öffentliche Projekt-URL und veröffentlichbarer (anon) Schlüssel aus deinem eigenen Supabase-Projekt. Niemals den Service-Role-Schlüssel hier eintragen.</p><div class="field-grid">${settingField('Supabase-Projekt-URL','cloudUrl',cloudConfig.url,'https://xyz.supabase.co')}${settingField('Publishable / anon Key','cloudKey',cloudConfig.anon,'eyJ...')}</div><div class="settings-row" style="margin-top:11px"><button class="btn small" data-action="cloudSave">Verbindung speichern</button><button class="btn small" data-action="cloudSync">${ic('cloud','sm')} Jetzt synchronisieren</button></div><p class="settings-status" id="cloudStatus">${state.cloudUser?'Angemeldet: '+esc(state.cloudUser.email||state.cloudUser.id):'Noch nicht angemeldet'}</p><div class="field">${settingField('E-Mail für sicheren Login','cloudEmail',state.cloudUser?.email||'','name@beispiel.de','email')}</div><div class="settings-row" style="margin-top:10px"><button class="btn small primary" data-action="cloudLogin">Login-Link senden</button><button class="btn small" data-action="cloudLogout" ${state.cloudUser?'':'disabled'}>Abmelden</button></div><div class="small-note" style="margin-top:9px">Login-Links funktionieren auf der gehosteten HTTPS-Webseite, nicht zuverlässig beim Öffnen einer lokalen HTML-Datei. Bei erster Verbindung werden die lokal vorhandenen Aufgaben hochgeladen.</div></div>
 <div class="settings-section"><h3>${ic('bell','sm')} Erinnerungen</h3><p>Browser-Benachrichtigungen sind nur ein Hinweis, wenn die Anwendung geöffnet wird. Für echte tägliche Meldungen ohne geöffnete App ist der Telegram-Dienst erforderlich.</p><label class="check-row"><input type="checkbox" id="browserBrief" ${prefs.browserBrief?'checked':''}> Tagesüberblick beim Öffnen (Browser)</label><button class="btn small" data-action="browserNotify">Browser-Benachrichtigungen erlauben</button><div class="small-note" style="margin-top:8px">Zuverlässige Benachrichtigungen erfordern HTTPS und die Browser-Erlaubnis.</div><div class="field-grid" style="margin-top:15px">${settingField('Telegram Chat-ID','chatId','','z. B. 123456789')}</div><label class="check-row"><input type="checkbox" id="tgEnabled"> Jeden Morgen um 08:00 Uhr (Berlin) Zusammenfassung per Telegram senden</label><div class="settings-row"><button class="btn small" data-action="saveTg">Telegram-Einstellungen speichern</button></div><div id="tgStatus" class="settings-status">Cloud-Anmeldung erforderlich. Du musst den Telegram-Bot zuvor auf deinem Telefon starten.</div><div class="small-note" style="margin-top:10px">Achtung: Bei Telegram werden die Aufgabentitel an den Telegram-Dienst übertragen. Vertrauliche Projektbezeichnungen ggf. neutral halten.</div></div>
 <div class="settings-section"><h3>${ic('download','sm')} Daten sichern und übertragen</h3><div class="settings-row"><button class="btn small" data-action="export">JSON-Backup</button><button class="btn small" data-action="csvExport">CSV für Excel</button><button class="btn small" data-action="import">Datei importieren</button></div><p style="margin-top:10px">Beim Import werden Aufgaben anhand ihrer IDs zusammengeführt. Erledigte Aufgaben bleiben im Archiv. Eine Sicherung ist sinnvoll, besonders vor größeren Änderungen.</p></div>
 <div class="settings-section"><h3>Über diese Version</h3><p>Klar. Aufgabenmanager · Offlinefähig bei installierter Web-App · Version 1.0. Die Aufgaben aus deiner Excel-Tabelle wurden ohne Makros übernommen; der Fokuswert entspricht der Berechnung in der Datei.</p></div></div></div></div>`;
 document.getElementById('browserBrief').addEventListener('change',e=>{prefs.browserBrief=e.target.checked;localStorage.setItem(PREF,JSON.stringify(prefs));});loadRemoteSettings();}
async function loadRemoteSettings(){if(!sb||!state.cloudUser||state.modal!=='settings')return;const {data,error}=await sb.from('notification_settings').select('telegram_chat_id,telegram_enabled').eq('user_id',state.cloudUser.id).maybeSingle();if(state.modal!=='settings')return;if(!error){document.getElementById('chatId').value=data?.telegram_chat_id||'';document.getElementById('tgEnabled').checked=Boolean(data?.telegram_enabled);document.getElementById('tgStatus').textContent=data?.telegram_enabled?'Telegram-Tagesüberblick aktiviert – sofern der Benachrichtigungsdienst eingerichtet ist.':'Telegram-Tagesüberblick nicht aktiviert.';}else document.getElementById('tgStatus').textContent='Cloud-Datenbank noch nicht eingerichtet: '+error.message;}
function createDownload(text,name,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function exportJson(){createDownload(JSON.stringify({version:1,exportedAt:new Date().toISOString(),tasks},null,2),'Klar_Aufgaben_Backup_'+today()+'.json','application/json');showToast('Backup heruntergeladen')}
function exportCsv(){const headers=['ID','Aufgabe','Bereich','Unterbereich','Projekt / Kontext','Status','Priorität','Fällig am','Min.','Nächster Schritt','Warten auf / Person','Erledigt am','Notizen'];const keys=['id','title','area','subcategory','context','status','priority','due','minutes','nextStep','waitingFor','doneAt','notes'];const q=x=>{let v=String(x??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"'};createDownload('\ufeff'+[headers.join(';'),...live().map(t=>keys.map(k=>q(t[k])).join(';'))].join('\r\n'),'Klar_Aufgaben_'+today()+'.csv','text/csv;charset=utf-8');showToast('CSV exportiert')}
function parseCsv(src){src=src.replace(/^\ufeff/,'');const sep=(src.split(/\r?\n/)[0].match(/;/g)||[]).length>0?';':',';let rows=[],cur=[],field='',quoted=false;for(let i=0;i<src.length;i++){const ch=src[i];if(ch==='"'&&quoted&&src[i+1]==='"'){field+='"';i++;}else if(ch==='"')quoted=!quoted;else if(ch===sep&&!quoted){cur.push(field);field='';}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&src[i+1]==='\n')i++;cur.push(field);if(cur.some(x=>x))rows.push(cur);cur=[];field='';}else field+=ch;}cur.push(field);if(cur.some(x=>x))rows.push(cur);const h=rows.shift()||[];return rows.map(r=>{const v={};h.forEach((k,i)=>v[k.trim()]=r[i]||'');return {id:v.ID||newId(),title:v.Aufgabe||v.title||'',area:v.Bereich||'Noch zuordnen',subcategory:v.Unterbereich||'',context:v['Projekt / Kontext']||'',status:v.Status||'Eingang',priority:v['Priorität']||'B - Mittel',due:v['Fällig am']||'',minutes:v['Min.']?Number(v['Min.']):null,nextStep:v['Nächster Schritt']||'',waitingFor:v['Warten auf / Person']||'',doneAt:v['Erledigt am']||'',notes:v.Notizen||'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),deletedAt:''}}).filter(t=>t.title.trim())}
async function importFile(file){try{const txt=await file.text();let input;if(file.name.toLowerCase().endsWith('.csv'))input=parseCsv(txt);else{const data=JSON.parse(txt);input=Array.isArray(data)?data:data.tasks;if(!Array.isArray(input))throw new Error('Keine Aufgabenliste gefunden.')}if(!input.length){showToast('Keine Aufgaben in dieser Datei');return}let n=0;for(const item of input){if(!item||typeof item.title!=='string'||!item.title.trim())continue;const t={id:item.id||newId(),title:item.title.trim(),area:item.area||'Noch zuordnen',subcategory:item.subcategory||'',context:item.context||'',status:STATUSES.includes(item.status)?item.status:'Eingang',priority:PRIORITIES.includes(item.priority)?item.priority:'B - Mittel',due:item.due||'',minutes:item.minutes??null,nextStep:item.nextStep||'',waitingFor:item.waitingFor||'',notes:item.notes||'',doneAt:item.doneAt||'',deletedAt:item.deletedAt||'',sourceRow:item.sourceRow||null,createdAt:item.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};const i=tasks.findIndex(x=>x.id===t.id);if(i>=0)tasks[i]=t;else tasks.push(t);n++;}save();render();enqueueSync();showToast(n+' Aufgaben importiert');}catch(e){showToast('Import fehlgeschlagen: '+e.message)}document.getElementById('fileImport').value='';}
function notifyBrowser(){if(!prefs.browserBrief||!('Notification' in window)||Notification.permission!=='granted')return;const key='klar.last.notification';if(localStorage.getItem(key)===today())return;const s=getStats();const msg=`${s.today} heute fällig · ${s.overdue} überfällig · ${s.open} offen.`;try{new Notification('Dein Aufgabenüberblick',{body:msg,icon:'icon-192.png'});localStorage.setItem(key,today())}catch(e){console.warn(e)}}
function validateConfig(){const url=String(cloudConfig.url||'').trim();const key=String(cloudConfig.anon||'').trim();if(!/^https:\/\/[^/]+\.supabase\.co\/?$/.test(url))throw new Error('Bitte eine gültige Supabase-Projekt-URL eingeben.');if(key.length<15)throw new Error('Bitte den Publishable / anon Key eingeben.');return {url,key}}
async function loadSupabaseLibrary(){if(window.supabase)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=resolve;s.onerror=()=>reject(new Error('Cloud-Bibliothek nicht erreichbar'));document.head.appendChild(s);setTimeout(()=>{if(!window.supabase)reject(new Error('Cloud-Bibliothek hat nicht geladen'))},10000)})}
async function bootCloud(){if(!cloudConfig.url||!cloudConfig.anon)return;try{await loadSupabaseLibrary();const {url,key}=validateConfig();sb=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});sb.auth.onAuthStateChange(async(_event,session)=>{const previous=state.cloudUser?.id;state.cloudUser=session?.user||null;updateSyncStatus();if(state.modal==='settings'){const e=document.getElementById('cloudStatus');if(e)e.textContent=state.cloudUser?'Angemeldet: '+(state.cloudUser.email||state.cloudUser.id):'Nicht angemeldet';}if(state.cloudUser&&previous!==state.cloudUser.id)await syncCloud();});const {data,error}=await sb.auth.getSession();if(error)throw error;state.cloudUser=data.session?.user||null;cloudBooted=true;updateSyncStatus();if(state.cloudUser)await syncCloud();}catch(e){state.cloudError=e.message;updateSyncStatus();}}
async function saveCloudConfig(){const url=document.getElementById('cloudUrl').value.trim().replace(/\/$/,'');const anon=document.getElementById('cloudKey').value.trim();cloudConfig={url,anon};try{validateConfig();localStorage.setItem(CLOUD_KEY,JSON.stringify(cloudConfig));if(sb){await sb.auth.signOut();sb=null;state.cloudUser=null;}state.cloudError='';await bootCloud();showToast('Verbindung gespeichert');}catch(e){showToast(e.message)}}
async function loginCloud(){if(!sb){showToast('Zuerst gültige Cloud-Verbindung speichern');return}if(location.protocol!=='https:'&&location.hostname!=='localhost'){showToast('Login bitte auf der gehosteten HTTPS-Seite verwenden');return}const email=document.getElementById('cloudEmail').value.trim();if(!email.includes('@')){showToast('Bitte E-Mail-Adresse eingeben');return}const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});showToast(error?'Login fehlgeschlagen: '+error.message:'Login-Link ist unterwegs – E-Mail prüfen');}
async function syncCloud(){if(!sb||!state.cloudUser||state.cloudBusy)return;state.cloudBusy=true;state.cloudError='';updateSyncStatus();try{const {data,error}=await sb.from('tasks').select('id,payload,updated_at').eq('user_id',state.cloudUser.id);if(error)throw error;const remote=new Map((data||[]).map(row=>[row.id,row]));let changes=[];for(const t of tasks){const r=remote.get(t.id);if(!r||String(t.updatedAt||'')>String(r.payload?.updatedAt||''))changes.push({id:t.id,user_id:state.cloudUser.id,payload:t,updated_at:t.updatedAt||new Date().toISOString()});else if(r.payload&&String(r.payload.updatedAt||'')>String(t.updatedAt||''))Object.assign(t,r.payload);remote.delete(t.id);}for(const r of remote.values())if(r.payload)tasks.push(r.payload);if(changes.length){for(let i=0;i<changes.length;i+=100){const {error:e}=await sb.from('tasks').upsert(changes.slice(i,i+100),{onConflict:'id'});if(e)throw e;}}save();render();}catch(e){state.cloudError=e.message;showToast('Cloud: '+e.message);}finally{state.cloudBusy=false;updateSyncStatus();}}
function enqueueSync(){if(!sb||!state.cloudUser)return;syncQueue=syncQueue.catch(()=>{}).then(()=>new Promise(r=>setTimeout(r,450))).then(()=>syncCloud());}
async function saveTelegram(){if(!sb||!state.cloudUser){showToast('Erst bei der Cloud anmelden');return}const chat=document.getElementById('chatId').value.trim(),enabled=document.getElementById('tgEnabled').checked;if(enabled&&!/^-?\d{5,20}$/.test(chat)){showToast('Telegram Chat-ID fehlt oder ist ungültig');return}const {error}=await sb.from('notification_settings').upsert({user_id:state.cloudUser.id,telegram_chat_id:chat,telegram_enabled:enabled,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)showToast('Speichern fehlgeschlagen: '+error.message);else{document.getElementById('tgStatus').textContent=enabled?'Einstellungen gespeichert. Nachrichtenzustellung setzt den eingerichteten Telegram-Bot und Zeitplan voraus.':'Telegram-Zusammenfassung deaktiviert.';showToast('Benachrichtigungseinstellungen gespeichert');}}
function init(){render();setTimeout(()=>{bootCloud().then(notifyBrowser)},700);setInterval(()=>{if(sb&&state.cloudUser&&!state.cloudBusy)syncCloud();notifyBrowser()},90000);window.addEventListener('online',()=>{if(sb&&state.cloudUser)syncCloud()});}
document.addEventListener('click',async e=>{if(e.target.dataset.overlay==='1'){closeModal();return}const b=e.target.closest('button');if(!b)return;if(b.dataset.page){setPage(b.dataset.page);return}const a=b.dataset.action,id=b.dataset.id;if(!a)return;
 if(a==='new'){openEdit();return}if(a==='edit'){openEdit(id);return}if(a==='complete'){const t=tasks.find(x=>x.id===id);if(t)updateTask(id,t.status==='Erledigt'?{status:'Offen',doneAt:''}:{status:'Erledigt',doneAt:today()});return}if(a==='close'){closeModal();return}if(a==='delete'){if(confirm('Diese Aufgabe wirklich löschen? Sie kann aus einem vorherigen Backup wiederhergestellt werden.')){updateTask(id,{deletedAt:new Date().toISOString()});closeModal();showToast('Aufgabe gelöscht')}return}if(a==='settings'){openSettings();return}if(a==='mode'){state.mode=b.dataset.mode;render();return}if(a==='export'){exportJson();return}if(a==='csvExport'){exportCsv();return}if(a==='import'){document.getElementById('fileImport').click();return}if(a==='month'){const [y,m]=state.calendarMonth.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+Number(b.dataset.delta),1));state.calendarMonth=`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;render();return}if(a==='calToday'){state.calendarMonth=today().slice(0,7);state.selectedDay=today();render();return}if(a==='selectday'){state.selectedDay=b.dataset.day;render();return}if(a==='cloudSave'){await saveCloudConfig();return}if(a==='cloudLogin'){await loginCloud();return}if(a==='cloudLogout'){if(sb){await sb.auth.signOut();state.cloudUser=null;updateSyncStatus();showToast('Cloud-Abmeldung erfolgreich. Lokale Kopie bleibt erhalten.')}return}if(a==='cloudSync'){await syncCloud();showToast(state.cloudError?'Synchronisierung fehlgeschlagen':'Synchronisierung geprüft');return}if(a==='saveTg'){await saveTelegram();return}if(a==='browserNotify'){if(!('Notification' in window)){showToast('Dein Browser unterstützt keine Benachrichtigungen');return}const p=await Notification.requestPermission();showToast(p==='granted'?'Browser-Benachrichtigungen erlaubt':'Benachrichtigungen nicht erlaubt');notifyBrowser();return}
});
document.addEventListener('change',e=>{if(e.target.matches('[data-filter]')){state[e.target.dataset.filter]=e.target.value;render();return}if(e.target.matches('[data-status-id]')){const id=e.target.dataset.statusId;updateTask(id,{status:e.target.value,doneAt:e.target.value==='Erledigt'?today():''});return}if(e.target.id==='fArea'){document.getElementById('subData').innerHTML=(SUBS[e.target.value]||[]).map(s=>`<option value="${esc(s)}">`).join('');}});
document.addEventListener('submit',e=>{if(e.target.id!=='taskForm')return;e.preventDefault();const f=new FormData(e.target),id=modalRoot.dataset.editId||'',old=id?tasks.find(t=>t.id===id):null;const obj=Object.fromEntries(f.entries());const title=String(obj.title||'').trim();if(!title){showToast('Bitte Aufgabentitel eingeben');return}const value={title,area:obj.area||'Noch zuordnen',subcategory:obj.subcategory.trim(),context:obj.context.trim(),status:obj.status,priority:obj.priority,due:obj.due,minutes:obj.minutes===''?null:Math.max(0,Number(obj.minutes)),nextStep:obj.nextStep.trim(),waitingFor:obj.waitingFor.trim(),doneAt:obj.status==='Erledigt'?(obj.doneAt||today()):'',notes:obj.notes.trim()};state.lastArea=value.area;
 if(old){Object.assign(old,value,{updatedAt:new Date().toISOString()})}else tasks.unshift({id:newId(),...value,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),deletedAt:''});save();closeModal();render();enqueueSync();showToast(old?'Aufgabe aktualisiert':'Aufgabe erstellt');});
document.getElementById('globalSearch').addEventListener('input',e=>{state.search=e.target.value;if(state.page==='dashboard'||state.page==='calendar')state.page='tasks';render();});document.getElementById('searchIcon').addEventListener('click',()=>{document.getElementById('searchBox').classList.toggle('open');document.getElementById('globalSearch').focus()});document.getElementById('fileImport').addEventListener('change',e=>{if(e.target.files[0])importFile(e.target.files[0])});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return}if(e.target.closest('input,textarea,select')||state.modal)return;if(e.key.toLowerCase()==='n'){e.preventDefault();openEdit()}if(e.key==='/'){e.preventDefault();if(state.page==='dashboard'||state.page==='calendar')setPage('tasks');document.getElementById('searchBox').classList.add('open');document.getElementById('globalSearch').focus()}});
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-drag-id]');if(c&&e.dataTransfer){e.dataTransfer.setData('text/plain',c.dataset.dragId);e.dataTransfer.effectAllowed='move'}});document.addEventListener('dragover',e=>{const c=e.target.closest('[data-drop-status]');if(c){e.preventDefault();c.classList.add('drag-over')}});document.addEventListener('dragleave',e=>{const c=e.target.closest('[data-drop-status]');if(c&&!c.contains(e.relatedTarget))c.classList.remove('drag-over')});document.addEventListener('drop',e=>{const c=e.target.closest('[data-drop-status]');if(!c)return;e.preventDefault();c.classList.remove('drag-over');const id=e.dataTransfer.getData('text/plain'),status=c.dataset.dropStatus;if(tasks.some(t=>t.id===id)&&STATUSES.includes(status))updateTask(id,{status,doneAt:status==='Erledigt'?today():''})});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
window.addEventListener('load',init);
})();
</script>
